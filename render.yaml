services:
  - type: web
    name: kt-peter-lynch
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && cd frontend && npm install && npm run build && cd ..
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MASTER_EMAIL
        sync: false
      - key: MASTER_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: KRX_SERVICE_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://kt-peter-lynch.onrender.com
      - key: SCAN_SECRET
        sync: false
      # ── 회원가입 인증코드 발송 (Gmail SMTP) ──
      # 값은 Render 대시보드 Environment 탭에서 입력 (secret이므로 git 미포함)
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
