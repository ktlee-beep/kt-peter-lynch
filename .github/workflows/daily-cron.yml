name: Daily Cron Triggers

on:
  schedule:
    # 아침 브리핑 — 08:00 KST = UTC 23:00 (일~목)
    - cron: '0 23 * * 0-4'
    # 미국 스캔   — 07:00 KST = UTC 22:00 (일~목)
    - cron: '0 22 * * 0-4'
    # KR 일일 스캔 — 20:00 KST = UTC 11:00 (월~금)
    - cron: '0 11 * * 1-5'
  # 수동·PC 신호 실행. GitHub schedule 은 수 시간씩 밀린다(2026-10-12 KR 스캔 11:00Z 예정 →
  # 20:04Z 실행, 9시간 지연). 그래서 PC 작업 스케줄러가 정시에 `gh workflow run -f job=kr` 로
  # 이 워크플로를 직접 부르고, 위 schedule 은 PC가 꺼져 있을 때의 예비로 남긴다.
  # job=wake 는 서버만 깨운다(동작 확인용, 스캔·브리핑 없음).
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 작업'
        type: choice
        options: [all, kr, us, brief, wake]
        default: all

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (cold start 대기)
        run: |
          echo "Pinging Render to wake up..."
          curl -sf https://kt-peter-lynch.onrender.com/healthz || true
          sleep 40

      - name: Morning Brief (08:00 KST)
        if: github.event.schedule == '0 23 * * 0-4' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'brief'))
        run: |
          echo "Triggering morning brief..."
          curl -sf -X POST https://kt-peter-lynch.onrender.com/api/brief/generate \
            -H "x-scan-secret: ${{ secrets.SCAN_SECRET }}" \
            && echo "OK" || echo "FAILED (non-fatal)"

      - name: US Scan (07:00 KST)
        if: github.event.schedule == '0 22 * * 0-4' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'us'))
        run: |
          echo "Triggering US scan..."
          curl -sf -X POST https://kt-peter-lynch.onrender.com/api/scan/us/trigger \
            -H "x-scan-secret: ${{ secrets.SCAN_SECRET }}" \
            && echo "OK" || echo "FAILED (non-fatal)"

      - name: KR Daily Scan (20:00 KST)
        if: github.event.schedule == '0 11 * * 1-5' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'kr'))
        run: |
          echo "Triggering KR daily scan..."
          curl -sf -X POST https://kt-peter-lynch.onrender.com/api/scan/trigger \
            -H "x-scan-secret: ${{ secrets.SCAN_SECRET }}" \
            && echo "OK" || echo "FAILED (non-fatal)"
