name: Universe Refresh (KRX 전종목)

# 스캔 유니버스를 시장 전체에서 다시 걸러낸다.
# 필터: 보통주(코드 끝자리 0) · ETF/ETN 제외 · 스팩 제외 · 시총 하한 · 거래대금 하한.
# 2026-08-28 실측 기준 시총 1,000억 / 거래대금 3억이면 약 1,150종목이 남는다.
#
# 일정: 매월 2일 01:00 KST (= 매월 1일 16:00 UTC).
# 같은 날 02:00 KST에 시작하는 펀더멘털 백필보다 1시간 앞선다 — 그 순서라야 이번 달에
# 새로 편입된 종목이 당월 백필에 바로 포함된다. 뒤집으면 신규 종목은 한 달을 기다린다.
#
# 유니버스 크기는 백필 예산과 직결된다. 종목당 최대 12회이므로 1,150종목 = 약 13,800회로
# 실행당 예산 15,000회 안에 1회전이 끝난다. 하한을 낮춰 종목 수를 늘리면 백필이
# 여러 날에 걸치게 되므로 임계값 변경 시 백필 워크플로의 실행일 범위(1-3)도 함께 본다.
#
# 주의: GitHub는 저장소가 60일간 활동이 없으면 예약 워크플로를 자동 비활성화한다. 이 저장소는
# 매일 도는 스캔 워크플로가 있어 해당되지 않지만, 커밋과 워크플로가 모두 멈추면 유니버스 갱신도
# 조용히 정지한다 [확인 필요 — 정지 시 별도 알림 없음].

on:
  schedule:
    - cron: '0 16 1 * *'
  workflow_dispatch:
    inputs:
      minCapEok:
        description: '시가총액 하한 (억원)'
        type: string
        default: '1000'
      minValueEok:
        description: '거래대금 하한 (억원). 낮게 두는 게 정상 — 주가가 빠진 종목이 표적이라 유동성 하한을 높이면 표적부터 잘린다'
        type: string
        default: '3'
      dryRun:
        description: '반영 없이 집계만'
        type: boolean
        default: false
      force:
        description: '이탈 종목 수 상한(활성의 30%)을 무시하고 반영'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BASE: https://kt-peter-lynch.onrender.com
      SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
      # github.event.inputs는 webhook 페이로드라 boolean 입력도 문자열 "true"/"false"로 온다.
      # 비어있지 않은 문자열은 'false'까지 truthy이므로 체크 해제가 보존된다.
      # `inputs.dryRun`으로 바꾸면 진짜 boolean이라 false || 'false' → 'false'가 되어
      # 동작은 같아 보이지만 full 쪽(기본값 true)에서는 체크 해제가 무시된다 — 같은 형식을 유지한다.
      MIN_CAP: ${{ github.event.inputs.minCapEok || '1000' }}
      MIN_VAL: ${{ github.event.inputs.minValueEok || '3' }}
      DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
    steps:
      - name: Wake up Render (cold start 대기)
        run: |
          curl -sf "$BASE/healthz" || true
          sleep 40

      - name: Trigger universe refresh
        run: |
          # 입력값을 JSON 본문에 펼치기 전에 형식을 강제한다. 큰따옴표 안에서도 $(...)와
          # 백틱은 평가되므로, 검증 없이 넣으면 workflow_dispatch 입력이 러너에서 실행된다.
          case "$MIN_CAP" in ''|*[!0-9]*) echo "minCapEok은 정수만 허용: $MIN_CAP"; exit 1;; esac
          # 거래대금 하한은 API가 0~1000 실수를 받는다(0.5억 같은 값). 정수만 허용하면
          # 워크플로에서 표현할 수 없는 값이 생기므로 소수점 한 개까지 통과시킨다.
          case "$MIN_VAL" in ''|.|*[!0-9.]*|*.*.*) echo "minValueEok은 숫자만 허용: $MIN_VAL"; exit 1;; esac
          case "$DRY_RUN" in true|false) ;; *) echo "dryRun은 true/false만 허용: $DRY_RUN"; exit 1;; esac
          case "$FORCE"   in true|false) ;; *) echo "force는 true/false만 허용: $FORCE"; exit 1;; esac
          BODY=$(printf '{"minCapEok": %s, "minValueEok": %s, "dryRun": %s, "force": %s}' \
            "$MIN_CAP" "$MIN_VAL" "$DRY_RUN" "$FORCE")
          echo "요청 본문: $BODY"
          # 409 = 이미 실행 중. 재시도해도 같은 작업이라 성공으로 간주하고 종료한다.
          CODE=$(curl -s -o /tmp/trigger.json -w '%{http_code}' \
            -X POST "$BASE/api/universe/refresh" \
            -H "x-scan-secret: $SCAN_SECRET" \
            -H 'Content-Type: application/json' \
            -d "$BODY")
          cat /tmp/trigger.json; echo
          if [ "$CODE" = "409" ]; then echo "이미 실행 중 — 종료"; exit 0; fi
          if [ "$CODE" != "200" ]; then echo "트리거 실패 (HTTP $CODE)"; exit 1; fi

      # 백필과 달리 유니버스 갱신은 1분 안에 끝나므로 결과까지 확인한다.
      # ok=false면 유니버스가 바뀌지 않은 것이고(안전장치 발동 포함) 조용히 넘어가면
      # 다음 달까지 낡은 유니버스로 스캔이 돈다 — 워크플로를 실패시켜 눈에 띄게 한다.
      - name: Verify result
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 20
            curl -s -o /tmp/status.json "$BASE/api/universe/status" -H "x-scan-secret: $SCAN_SECRET"
            cat /tmp/status.json; echo
            [ "$(jq -r '.running' /tmp/status.json)" = "false" ] || continue
            jq -e '.last.ok == true' /tmp/status.json >/dev/null \
              || { echo "갱신 실패 — 유니버스는 변경되지 않음"; exit 1; }
            # ok:true만으로는 부족하다. 서버 안전장치를 전부 통과한 뒤에도 결과가 이상할 수 있고,
            # 그 경우 다음 달까지 아무도 모른 채 축소된 유니버스로 스캔이 돈다.
            # 아래 값은 서버 가드(최소 500 / 이탈 30%)의 중복 확인이며 실측 1,136종목 기준이다.
            UNI=$(jq -r '.last.universe // 0' /tmp/status.json)
            DEA=$(jq -r '.last.deactivated // 0' /tmp/status.json)
            [ "$UNI" -ge 600 ] || { echo "유니버스 $UNI 종목 — 평시 1,100종목대 대비 비정상"; exit 1; }
            [ "$DEA" -le 200 ] || { echo "이탈 $DEA 종목 — 월간 이탈로는 과다"; exit 1; }
            echo "갱신 성공 (유니버스 $UNI, 이탈 $DEA)"; exit 0
          done
          echo "2분 내에 끝나지 않음 — 상태 확인 필요"; exit 1
