name: Render Keepalive

# Render free 플랜은 15분 무활동 시 슬립한다. 14분 간격 핑으로 사용자 첫 방문
# 콜드스타트(약 40초)를 줄이는 것이 이 워크플로의 목적이다.
#
# 주의 — "지연돼도 keepalive 용도로는 무해하다"던 종전 주석은 실측으로 반증됐다.
# gh run list 기준 실제 실행 간격(2026-09-13~14): 01:12Z, 06:10Z, 11:48Z, 15:06Z,
# 18:09Z, 20:46Z, 22:41Z, 00:26Z, 05:16Z, 10:48Z — 14분이 아니라 3~5시간이다.
# GitHub 은 고빈도 schedule 워크플로를 심하게 지연·생략한다. 따라서 이 파일에
# 슬립 방지를 의존하면 안 된다. 야간 스캔이 도는 동안의 슬립 방지는 프로세스
# 안에서 cron.js 의 킵얼라이브(4분 간격 자기 /healthz 핑)가 담당한다.

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://kt-peter-lynch.onrender.com/healthz)
          echo "Status: $STATUS"
