name: Fundamentals Backfill (DART)

# 저평가 선점 스크리너용 DART 데이터 적재 — 기업개황(표준산업분류·결산월) ·
# 최근 5개 사업연도 · 최근 분기(11013/11012/11014).
#
# 한 종목에 최대 12회(개황 1 + 연간 5 + 분기 6)가 들어 상장사 전체는 약 47,000회다.
# DART 일일 쿼터가 20,000회이므로 한 번에 완주할 수 없다. 실행당 예산을 15,000회로
# 묶고 3일 연속 돌려 1회전을 끝낸다 — 서버 쪽 백필이 신선한 캐시를 건너뛰는
# 재개형이라 같은 요청을 반복해도 중복 없이 이어서 진행된다.
#
# 일정: 매월 2~4일 02:00 KST (= 매월 1~3일 17:00 UTC).
# 사업보고서는 사업연도 종료 후 90일 이내 제출(「자본시장과 금융투자업에 관한 법률」
# 제159조)이므로 직전 사업연도는 4월 실행분에서 채워진다.

on:
  schedule:
    - cron: '0 17 1-3 * *'
  workflow_dispatch:
    inputs:
      full:
        description: '전 상장사(약 3,930) 대상. 해제 시 현재 스캔 유니버스만'
        type: boolean
        default: true
      maxDartCalls:
        description: '이번 실행의 DART 호출 예산 (최대 19000)'
        type: string
        default: '15000'

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BASE: https://kt-peter-lynch.onrender.com
      SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
      # github.event.inputs는 webhook 페이로드라 boolean 입력도 문자열 "true"/"false"로 온다.
      # 표현식에서 비어있지 않은 문자열은 'false'까지 truthy라 체크 해제가 그대로 보존된다.
      # `inputs.full`로 바꾸면 깨진다 — 그쪽은 진짜 boolean이라 false || 'true' → 'true'가 되어
      # 체크 해제가 무시된다. schedule 이벤트에서는 inputs가 null이라 'true'로 폴백된다.
      FULL: ${{ github.event.inputs.full || 'true' }}
      BUDGET: ${{ github.event.inputs.maxDartCalls || '15000' }}
    steps:
      - name: Wake up Render (cold start 대기)
        run: |
          curl -sf "$BASE/healthz" || true
          sleep 40

      - name: Trigger backfill
        run: |
          # 입력값을 JSON 본문에 펼치기 전에 형식을 강제한다. 큰따옴표 안에서도 $(...)와
          # 백틱은 평가되므로, 검증 없이 넣으면 workflow_dispatch 입력이 러너에서 실행된다.
          case "$FULL"   in true|false) ;; *) echo "full은 true/false만 허용: $FULL"; exit 1;; esac
          case "$BUDGET" in ''|*[!0-9]*) echo "maxDartCalls는 숫자만 허용: $BUDGET"; exit 1;; esac
          BODY=$(printf '{"full": %s, "maxDartCalls": %s}' "$FULL" "$BUDGET")
          echo "요청 본문: $BODY"
          # 409 = 이미 실행 중, 429 = 오늘 예산 소진. 둘 다 재시도하면 쿼터를 두 배로
          # 태우거나 무의미하므로 성공으로 간주하고 그대로 종료한다.
          CODE=$(curl -s -o /tmp/trigger.json -w '%{http_code}' \
            -X POST "$BASE/api/backfill/fundamentals/trigger" \
            -H "x-scan-secret: $SCAN_SECRET" \
            -H 'Content-Type: application/json' \
            -d "$BODY")
          cat /tmp/trigger.json; echo
          if [ "$CODE" = "409" ]; then echo "이미 실행 중 — 종료"; exit 0; fi
          if [ "$CODE" = "429" ]; then echo "오늘 DART 예산 소진 — 종료"; exit 0; fi
          if [ "$CODE" != "200" ]; then echo "트리거 실패 (HTTP $CODE)"; exit 1; fi

      # 백필은 수 시간이 걸릴 수 있어 완료까지 기다리지 않는다. 여기서는 초반에
      # 죽지 않았는지만 확인하고, 최종 집계는 다음 실행의 status 응답으로 확인한다.
      - name: Check progress (5분 후 1회)
        run: |
          sleep 300
          curl -sf "$BASE/api/backfill/fundamentals/status" \
            -H "x-scan-secret: $SCAN_SECRET" || echo "상태 조회 실패 (non-fatal)"
